<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="260" height="260" viewBox="0 0 260 260" role="img" aria-label="Demesne sticker: the d. mark with a cherry blossom under a full moon">
  <defs>
    <radialGradient id="sky" cx="62%" cy="30%" r="80%">
      <stop offset="0" stop-color="#4a3a7a"/>
      <stop offset=".55" stop-color="#2a2150"/>
      <stop offset="1" stop-color="#15122b"/>
    </radialGradient>
    <radialGradient id="moon" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff8fb"/>
      <stop offset=".7" stop-color="#f9dbe7"/>
      <stop offset="1" stop-color="#f3c4d7"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f9d4e3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#f9d4e3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2a2238" flood-opacity=".28"/>
    </filter>
    <clipPath id="face"><circle cx="130" cy="130" r="108"/></clipPath>
    <mask id="hole"><rect x="-40" y="-40" width="80" height="80" fill="#fff"/><circle r="5" fill="#000"/></mask>
    <g id="petal"><path d="M0 -3C-11 -9 -17 -24 -9 -35L0 -29.5L9 -35C17 -24 11 -9 0 -3Z"/></g>
    <g id="flower">
      <use href="#petal" xlink:href="#petal"/><use href="#petal" xlink:href="#petal" transform="rotate(72)"/><use href="#petal" xlink:href="#petal" transform="rotate(144)"/><use href="#petal" xlink:href="#petal" transform="rotate(216)"/><use href="#petal" xlink:href="#petal" transform="rotate(288)"/>
    </g>
  </defs>

  <!-- die-cut white border with a soft shadow -->
  <circle cx="130" cy="130" r="120" fill="#fff" filter="url(#shadow)"/>

  <g clip-path="url(#face)">
    <circle cx="130" cy="130" r="108" fill="url(#sky)"/>
    <!-- stars -->
    <g fill="#fff">
      <circle cx="58" cy="70" r="1.4" opacity=".8"/><circle cx="88" cy="48" r="1" opacity=".7"/><circle cx="196" cy="118" r="1.2" opacity=".7"/>
      <circle cx="70" cy="112" r="1" opacity=".6"/><circle cx="214" cy="82" r="1" opacity=".6"/><circle cx="118" cy="40" r="1.1" opacity=".7"/>
      <path d="M44 96 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2z" opacity=".85"/>
      <path d="M190 54 l1.5 4.5 4.5 1.5 -4.5 1.5 -1.5 4.5 -1.5 -4.5 -4.5 -1.5 4.5 -1.5z" opacity=".8"/>
    </g>
    <!-- moon -->
    <circle cx="168" cy="78" r="46" fill="url(#glow)"/>
    <circle cx="168" cy="78" r="28" fill="url(#moon)"/>
    <!-- branch -->
    <path d="M18 64 C62 70 92 92 118 86 C142 80 160 98 196 92 C214 89 232 96 246 104" fill="none" stroke="#3a2a45" stroke-width="6" stroke-linecap="round"/>
    <path d="M92 86 C96 72 104 64 116 58" fill="none" stroke="#3a2a45" stroke-width="3" stroke-linecap="round"/>
    <path d="M160 96 C166 108 178 114 190 116" fill="none" stroke="#3a2a45" stroke-width="3" stroke-linecap="round"/>
    <g fill="#f6a8c4">
      <g transform="translate(48 70) scale(.36)"><use href="#flower" xlink:href="#flower" mask="url(#hole)"/></g>
      <g transform="translate(116 58) scale(.32) rotate(20)"><use href="#flower" xlink:href="#flower" mask="url(#hole)"/></g>
      <g transform="translate(136 86) scale(.4) rotate(-12)"><use href="#flower" xlink:href="#flower" mask="url(#hole)"/></g>
      <g transform="translate(190 116) scale(.34) rotate(30)"><use href="#flower" xlink:href="#flower" mask="url(#hole)"/></g>
      <g transform="translate(222 98) scale(.3) rotate(8)"><use href="#flower" xlink:href="#flower" mask="url(#hole)"/></g>
    </g>
    <g fill="#e0457a">
      <g transform="translate(84 84) scale(.26) rotate(40)"><use href="#flower" xlink:href="#flower" mask="url(#hole)"/></g>
      <g transform="translate(172 100) scale(.24) rotate(-20)"><use href="#flower" xlink:href="#flower" mask="url(#hole)"/></g>
    </g>
    <!-- falling petals -->
    <g fill="#f6a8c4" opacity=".9">
      <ellipse cx="62" cy="140" rx="4" ry="2.2" transform="rotate(-30 62 140)"/>
      <ellipse cx="206" cy="150" rx="3.5" ry="2" transform="rotate(25 206 150)"/>
      <ellipse cx="102" cy="122" rx="3" ry="1.7" transform="rotate(10 102 122)"/>
    </g>
  </g>

  <!-- the d. mark, white, with the blossom full stop -->
  <g transform="translate(84 92) scale(1.05)">
    <circle cx="43" cy="59" r="15" fill="none" stroke="#fff" stroke-width="9"/>
    <path d="M58 24V74" stroke="#fff" stroke-width="9" stroke-linecap="round"/>
    <g transform="translate(80 66) scale(.31)" fill="#ff6f9f"><use href="#flower" xlink:href="#flower" mask="url(#hole)"/></g>
  </g>

  <!-- name along the bottom -->
  <text x="130" y="218" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="5" fill="#fff" opacity=".92">DEMESNE</text>

  <!-- glossy sticker shine -->
  <circle cx="130" cy="130" r="108" fill="url(#shine)" clip-path="url(#face)"/>
</svg>
